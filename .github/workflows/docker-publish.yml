name: Build and publish image

on:
  push:
    branches:
      - main # publishes the :edge tag
    tags:
      - "v*.*.*" # publishes :X.Y.Z, :X.Y, :latest and cuts a Release
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # e.g. wallnalyr/event-horizon (lowercase)

# Serialize publishes per ref; do NOT cancel in-progress (never abort a release build).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR using the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the final (Alpine) stage's arch-specific RUN steps run for
      # arm64; the Go binary itself is cross-compiled with CGO disabled.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          # latest=auto -> a semver tag on the default branch also gets :latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  release:
    name: Create GitHub Release
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Multi-arch container image (linux/amd64, linux/arm64):

            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
            ```

            Pull and run with the bundled `docker-compose.yml`:

            ```bash
            docker compose pull
            docker compose up -d
            ```
