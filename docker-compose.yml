services:
  event-horizon:
    # Pull the pre-built multi-arch image (linux/amd64, linux/arm64) from GHCR.
    # Override the tag with EVENT_HORIZON_TAG=v1.2.3 (defaults to :latest).
    image: ghcr.io/wallnalyr/event-horizon:${EVENT_HORIZON_TAG:-latest}
    # To build locally instead of pulling, comment out `image:` above and use:
    # build: .
    container_name: event-horizon
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - HOST=0.0.0.0
      # Security: Memory limits
      - MAX_FILE_SIZE=104857600    # 100MB
      - MAX_MEMORY=536870912       # 512MB
      # Security: File/clipboard expiry
      - FILE_EXPIRY=24h
      - CLIPBOARD_EXPIRY=1h
      # Security: Rate limiting
      - RATE_LIMIT=600             # 600/min general
      - UPLOAD_RATE_LIMIT=20       # 20/min uploads
      # Security: CORS
      - ENABLE_CORS=true
      # Feature flags
      - ENABLE_CLIPBOARD=true
      - ENABLE_CLIPBOARD_IMAGE=true
      - ENABLE_FILE_SHARING=true
      # E2EE needs a secure context. Set TLS_ENABLED=true to serve HTTPS with a
      # self-signed cert (browsers warn once), or terminate TLS at a reverse proxy.
      # - TLS_ENABLED=true
    restart: unless-stopped

    # Security: Send SIGTERM for graceful shutdown (secure data wipe)
    stop_signal: SIGTERM
    stop_grace_period: 30s

    # Security: Memory limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    # Security: Drop all capabilities, add IPC_LOCK for memguard
    cap_drop:
      - ALL
    cap_add:
      - IPC_LOCK  # Required for mlock (memguard secure memory)

    # Security: No new privileges
    security_opt:
      - no-new-privileges:true

    # Security: Read-only filesystem
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64M

    # Security: Prevent swapping secrets to disk
    ulimits:
      memlock:
        soft: -1
        hard: -1
      core:
        soft: 0
        hard: 0  # No core dumps (prevent secret leakage)

    # Disable swap at container level
    mem_swappiness: 0

    healthcheck:
      # Works for both HTTP and HTTPS (if TLS_ENABLED=true is set above).
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:9000/api/ping || wget -q --no-check-certificate -O /dev/null https://127.0.0.1:9000/api/ping"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
